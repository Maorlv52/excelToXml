<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Excel File</title>
    <style>
        /* Body and Background */
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #1E90FF, #00BFFF);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
            overflow: hidden;
        }

        /* Positioning the logo with dark background */
        .logo-container {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border-radius: 10px;
        }

        .logo {
            width: 80px;
            height: auto;
            cursor: pointer;
        }

        /* Container Style */
        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 500px;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header Style */
        h1 {
            font-size: 28px;
            color: #222;
            margin-bottom: 30px;
            font-weight: 600;
            background: -webkit-linear-gradient(45deg, #00BFFF, #1E90FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* File Upload Button Style */
        .custom-file-upload {
            display: inline-block;
            background-color: #1E90FF;
            color: white;
            border-radius: 8px;
            padding: 14px 28px;
            margin-bottom: 20px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .custom-file-upload:hover {
            background-color: #4682B4;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transform: translateY(-2px);
        }

        input[type="file"] {
            display: none;
        }

        /* File Info Style */
        .file-info {
            margin-top: 15px;
            font-size: 18px;
            color: #1E90FF;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .file-info.hidden {
            opacity: 0;
        }

        /* Submit Button Style */
        button {
            display: inline-block;
            background-color: #28A745;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #218838;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transform: translateY(-2px);
        }

        /* Message and Download Button Styles */
        #message {
            margin-top: 20px;
            font-size: 16px;
            color: #333;
        }

        #downloadLink {
            margin-top: 20px;
        }

        #downloadLink button {
            background-color: #FFA500;
            transition: all 0.3s ease;
        }

        #downloadLink button:hover {
            background-color: #FF8C00;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        /* Loader Animation */
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #1E90FF;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

    </style>
</head>
<body>
<!-- Logo with Link -->
<div class="logo-container">
    <a href="https://www.icpd.co.il" target="_blank">
        <img src="lianLogo.png" alt="Lian Logo" class="logo">
    </a>
</div>

<!-- Main Upload Container -->
<div class="container">
    <h1>Excel העלה קובץ</h1>
    <form id="uploadForm">
        <label class="custom-file-upload">
            <input type="file" name="file" required id="fileInput">
            בחר קובץ
        </label>
        <p id="fileName" class="file-info hidden">No file selected</p>

        <button type="submit">העלה קובץ</button>
    </form>
    <div id="message"></div>
    <div id="downloadLink"></div>
    <div class="loader" id="loader"></div> <!-- Loader for upload process -->
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const fileNameDisplay = document.getElementById('fileName');
    const loader = document.getElementById('loader');

    // Update the UI when a file is selected
    fileInput.addEventListener('change', function() {
        const selectedFile = fileInput.files[0];
        if (selectedFile) {
            fileNameDisplay.textContent = `${selectedFile.name} :קובץ שנבחר `;
            fileNameDisplay.classList.remove('hidden');
        } else {
            fileNameDisplay.textContent = 'No file selected';
            fileNameDisplay.classList.add('hidden');
        }
    });

    document.getElementById('uploadForm').onsubmit = async function(event) {
        event.preventDefault();
        const formData = new FormData(this);
        loader.style.display = 'block';

        const response = await fetch('/upload', {
            method: 'POST',
            body: formData,
        }).catch(err => {
            console.error('Fetch error:', err);
            document.getElementById('message').textContent = 'Error connecting to server.';
            loader.style.display = 'none';
        });

        if (response && response.ok) {
            const result = await response.json();
            document.getElementById('message').textContent = result.message;
            const downloadButton = `<a href="${result.filePath}" download><button>הורד קובץ</button></a>`;
            document.getElementById('downloadLink').innerHTML = downloadButton;
        } else {
            document.getElementById('message').textContent = 'Error processing file';
        }

        loader.style.display = 'none';
    };
</script>
</body>
</html>
